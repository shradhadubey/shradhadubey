name: Metrics

on:
  # Schedule every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Allows manual runs from Actions tab
  workflow_dispatch:
  # Runs automatically when updating the README
  push:
    branches: ["master", "main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: shradhadubey
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
