name: Daily Python Tip
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  update-tip:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' # Prevent the bot from triggering itself
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Run Update Script
        run: python update_tip.py
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: daily python tip update" || exit 0
          git push
